<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #0f172a; font-family: Inter, sans-serif;">
  <!-- Streamlit Top Bar -->
  <rect x="0" y="0" width="1000" height="45" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="25" cy="22" r="6" fill="#ff4b4b"/>
  <text x="40" y="27" fill="#f8fafc" font-size="14" font-weight="bold">Streamlit - Financial Performance &amp; Business Insights Web App</text>
  
  <!-- Left Sidebar Mockup -->
  <rect x="0" y="45" width="220" height="555" fill="#0f172a" stroke="#1e293b"/>
  <text x="20" y="80" fill="#f8fafc" font-size="16" font-weight="bold">Financial Filters</text>
  
  <text x="20" y="115" fill="#94a3b8" font-size="11">🎨 UI Theme Mode:</text>
  <rect x="20" y="125" width="180" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="30" y="144" fill="#f8fafc" font-size="11">Dark Glassmorphism</text>

  <text x="20" y="175" fill="#94a3b8" font-size="11">Select Year(s):</text>
  <rect x="20" y="185" width="180" height="28" rx="4" fill="#6366f1"/>
  <text x="30" y="204" fill="#ffffff" font-size="11" font-weight="bold">2023, 2024, 2025</text>

  <text x="20" y="235" fill="#94a3b8" font-size="11">Select Region(s):</text>
  <rect x="20" y="245" width="180" height="28" rx="4" fill="#1e293b"/>
  <text x="30" y="264" fill="#f8fafc" font-size="11">All 5 Regions</text>

  <text x="20" y="295" fill="#94a3b8" font-size="11">Select Category:</text>
  <rect x="20" y="305" width="180" height="28" rx="4" fill="#1e293b"/>
  <text x="30" y="324" fill="#f8fafc" font-size="11">All 5 Categories</text>

  <rect x="20" y="360" width="180" height="35" rx="6" fill="#1e293b" stroke="#6366f1"/>
  <text x="110" y="382" fill="#6366f1" font-size="12" font-weight="bold" text-anchor="middle">🔄 Reset Filters</text>

  <!-- Main Content Body -->
  <rect x="240" y="65" width="740" height="520" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="260" y="100" fill="#f8fafc" font-size="18" font-weight="bold">💼 Financial Performance &amp; Business Insights</text>
  <text x="260" y="120" fill="#94a3b8" font-size="12">Interactive executive web application with real-time KPI cards &amp; scenario simulation.</text>

  <!-- Streamlit KPI Cards -->
  <rect x="260" y="140" width="130" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="270" y="160" fill="#94a3b8" font-size="10">TOTAL REVENUE</text>
  <text x="270" y="185" fill="#f8fafc" font-size="16" font-weight="bold">$366.57M</text>

  <rect x="405" y="140" width="130" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="415" y="160" fill="#94a3b8" font-size="10">GROSS PROFIT</text>
  <text x="415" y="185" fill="#f8fafc" font-size="16" font-weight="bold">$216.04M</text>

  <rect x="550" y="140" width="130" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="560" y="160" fill="#94a3b8" font-size="10">EXPENSES</text>
  <text x="560" y="185" fill="#f8fafc" font-size="16" font-weight="bold">$256.78M</text>

  <rect x="695" y="140" width="130" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="705" y="160" fill="#94a3b8" font-size="10">NET PROFIT</text>
  <text x="705" y="185" fill="#f8fafc" font-size="16" font-weight="bold">$109.79M</text>

  <rect x="840" y="140" width="120" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="850" y="160" fill="#94a3b8" font-size="10">BUDGET UTIL</text>
  <text x="850" y="185" fill="#10b981" font-size="16" font-weight="bold">101.6%</text>

  <!-- Navigation Tabs -->
  <rect x="260" y="225" width="700" height="35" rx="6" fill="#0f172a"/>
  <rect x="265" y="228" width="140" height="29" rx="4" fill="#6366f1"/>
  <text x="335" y="247" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">📊 Exec Summary</text>
  <text x="460" y="247" fill="#94a3b8" font-size="11" text-anchor="middle">🌍 Regional</text>
  <text x="570" y="247" fill="#94a3b8" font-size="11" text-anchor="middle">📦 Product</text>
  <text x="680" y="247" fill="#94a3b8" font-size="11" text-anchor="middle">💸 Expense</text>
  <text x="800" y="247" fill="#94a3b8" font-size="11" text-anchor="middle">📈 Forecast</text>
  <text x="910" y="247" fill="#94a3b8" font-size="11" text-anchor="middle">🔍 Exporter</text>

  <!-- Plotly Interactive Chart area -->
  <rect x="260" y="275" width="700" height="290" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="280" y="305" fill="#f8fafc" font-size="14" font-weight="bold">Interactive Plotly Revenue &amp; Net Profit Trend ($M)</text>
  <path d="M 280 520 Q 500 450 650 400 T 940 330" fill="none" stroke="#6366f1" stroke-width="4"/>
  <path d="M 280 540 Q 500 490 650 450 T 940 390" fill="none" stroke="#10b981" stroke-width="4"/>
</svg>
