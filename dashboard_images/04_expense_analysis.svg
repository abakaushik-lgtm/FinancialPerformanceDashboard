<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #0f172a; font-family: Inter, sans-serif;">
  <rect x="0" y="0" width="1000" height="60" fill="#1e293b"/>
  <text x="30" y="38" fill="#f8fafc" font-size="20" font-weight="bold">💸 Power BI - Page 4: Expense Structure &amp; Cost Audit</text>
  
  <!-- Left P&L Waterfall Chart -->
  <rect x="30" y="80" width="560" height="480" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="115" fill="#f8fafc" font-size="16" font-weight="bold">Financial P&amp;L Waterfall Breakdown ($M)</text>

  <!-- Revenue Bar -->
  <rect x="70" y="150" width="60" height="340" fill="#6366f1" rx="4"/>
  <text x="100" y="140" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Revenue</text>
  <text x="100" y="320" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">$366.6M</text>

  <!-- COGS Bar -->
  <rect x="150" y="290" width="60" height="200" fill="#ef4444" rx="4"/>
  <text x="180" y="280" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">-COGS</text>
  <text x="180" y="390" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">-$150.5M</text>

  <!-- OpEx Bar -->
  <rect x="230" y="350" width="60" height="90" fill="#ef4444" rx="4"/>
  <text x="260" y="340" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">-OpEx</text>
  <text x="260" y="400" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">-$59.8M</text>

  <!-- Marketing Bar -->
  <rect x="310" y="400" width="60" height="50" fill="#ef4444" rx="4"/>
  <text x="340" y="390" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">-Mktg</text>
  <text x="340" y="430" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">-$29.2M</text>

  <!-- Tax Bar -->
  <rect x="390" y="430" width="60" height="30" fill="#ef4444" rx="4"/>
  <text x="420" y="420" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">-Tax</text>

  <!-- Net Profit Bar -->
  <rect x="470" y="390" width="70" height="100" fill="#10b981" rx="4"/>
  <text x="505" y="380" fill="#10b981" font-size="13" font-weight="bold" text-anchor="middle">Net Profit</text>
  <text x="505" y="445" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">$109.8M</text>

  <!-- Right Side Department Breakdown -->
  <rect x="610" y="80" width="360" height="480" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="630" y="115" fill="#f8fafc" font-size="16" font-weight="bold">Department Expenses ($M)</text>

  <rect x="630" y="150" width="320" height="45" rx="6" fill="#334155"/>
  <text x="645" y="177" fill="#ffffff" font-size="13" font-weight="bold">Operations: $15.2M (25.4%)</text>

  <rect x="630" y="210" width="320" height="45" rx="6" fill="#334155"/>
  <text x="645" y="237" fill="#ffffff" font-size="13" font-weight="bold">Engineering: $13.8M (23.1%)</text>

  <rect x="630" y="270" width="320" height="45" rx="6" fill="#334155"/>
  <text x="645" y="297" fill="#ffffff" font-size="13" font-weight="bold">Sales: $12.1M (20.2%)</text>

  <rect x="630" y="330" width="320" height="45" rx="6" fill="#334155"/>
  <text x="645" y="357" fill="#ffffff" font-size="13" font-weight="bold">Marketing: $10.4M (17.4%)</text>

  <rect x="630" y="390" width="320" height="45" rx="6" fill="#334155"/>
  <text x="645" y="417" fill="#ffffff" font-size="13" font-weight="bold">Support: $8.3M (13.9%)</text>
</svg>
